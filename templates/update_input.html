{% extends "layout.html" %}
{% block body %}
<div class="form-container">
  <h2>اسم المنتج للتعديل</h2>

  <form action="/name_update" method="post" class="product-form">
    <div class="product-form2">
      {% for i in names_products %}
        <label class="radio-item">
          <input type="radio" name="name_product" value="{{ i }}" required onchange="this.form.submit()">
          <span>{{ i }}</span>
        </label>
      {% endfor %}
    </div>
  </form>
</div>
{% endblock %}
